name: Python Application Test

on:
  push:
    branches:
      - "main"
      - "develop"
      - "Ali-Testing"  # Runs on the main, develop, and Ali-Testing branches
  pull_request:
    branches:
      - "main"
      - "develop"
      - "Ali-Testing"  # Runs on PRs targeting these branches

permissions:
  contents: read  # Permissions to read repository contents

jobs:
  build:
    runs-on: ubuntu-latest  # Runs the workflow on the latest Ubuntu environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # Checks out the code from your repository

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"  # Sets up Python version 3.10

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip  # Cache pip dependencies to speed up workflow
        key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flask pytest  # Install Flask and Pytest if not listed in requirements.txt

    - name: Run tests with pytest
      run: |
        pytest --maxfail=1 --disable-warnings -q --junitxml=test-results/results.xml

    - name: Upload test results
      if: success()  # Upload test results only if the tests are successful
      uses: actions/upload-artifact@v4  # Use the stable version v4
      with:
        name: pytest-results
        path: test-results/

    - name: Notify on failure
      if: failure()  # Notify Slack only if the tests fail
      run: |
        curl -X POST -H 'Content-type: application/json' --data '{"text":"Test failure on commit push"}' ${{ secrets.SLACK_WEBHOOK_URL }}
