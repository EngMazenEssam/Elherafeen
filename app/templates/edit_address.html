<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Address</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">
</head>
<body>

<main class="container edit-profile-page">
  <div class="edit-card">
    <h1>Edit Address</h1>

    <form method="POST">

      <div class="form-group">
        <label>Street</label>
        <input type="text" name="street" value="{{ address.street }}" required>
      </div>

      <div class="form-group">
        <label>City</label>
        <input type="text" name="city" value="{{ address.city }}" required>
      </div>

      <div class="form-group">
        <label>Country</label>
        <input type="text" name="country" value="{{ address.country }}" required>
      </div>

      <div class="form-actions">
        <button class="btn-save">Save</button>
        <a href="{{ url_for('profile.profile') }}" class="btn-cancel">Cancel</a>
      </div>

    </form>
  </div>
</main>

</body>
</html>
