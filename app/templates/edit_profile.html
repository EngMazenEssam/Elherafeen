<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Profile | Elherafeen</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">
</head>
<body>

<header>
  <div class="container">
    <div class="top-row">
      <div class="logo">
        <img src="{{ url_for('static', filename='images/icons/ELHERAFEEN LOGO BLACK.png') }}">
      </div>

      <div class="search-bar">
        <input type="search" placeholder="Search for parts">
      </div>

      <div class="icons">
        <a href="{{ url_for('profile.profile') }}" class="btn auth">Profile</a>
      </div>
    </div>

    <nav class="sections">
      <a href="{{ url_for('home.home') }}">Home</a>
      <a href="{{ url_for('product.product_list') }}">All Products</a>
      <a href="{{ url_for('profile.profile') }}">Profile</a>
    </nav>
  </div>
</header>

<main class="container edit-profile-page">

  <div class="edit-card">
    <h1>Edit Profile</h1>

    <form method="POST" action="{{ url_for('profile.edit_profile') }}">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullname" value="{{ user.fullname }}" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" value="{{ user.email }}" disabled>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" value="{{ user.phone }}" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-save">Save Changes</button>
        <a href="{{ url_for('profile.profile') }}" class="btn-cancel">Cancel</a>
      </div>

    </form>
  </div>

</main>

</body>
</html>
